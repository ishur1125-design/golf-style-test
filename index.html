<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  .card{background:var(--card); border:1px solid var(--rule); box-shadow:0 1px 0 var(--rule), 3px 3px 0 rgba(23,54,43,.06);}
  .serif{font-family:var(--serif);}
  .center{text-align:center;}
  .muted{color:var(--ink-soft);}
  .hair{width:34px;height:1px;background:var(--brass);margin:16px auto;}

  h1.title{font-family:var(--serif); font-size:38px; line-height:1.25; font-weight:400; color:var(--turf); margin:0 0 14px; letter-spacing:-.01em;}
  @media (max-width:400px){ h1.title{font-size:31px;} }

  .badge-test{
    display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    color:var(--red); border:1px solid var(--red); padding:5px 11px; border-radius:2px;
  }

  button{font-family:var(--sans); cursor:pointer;}
  .btn{border:1px solid var(--turf); background:transparent; color:var(--turf); transition:background .14s ease,color .14s ease; border-radius:2px;}
  .btn:hover{background:var(--turf); color:var(--card);}
  .btn:focus-visible{outline:2px solid var(--brass); outline-offset:2px;}
  .btn-solid{background:var(--turf); color:var(--card);}
  .btn-solid:hover{background:var(--turf-soft);}
  .btn-block{width:100%; padding:16px; font-size:16px; letter-spacing:.02em;}

  .opt{
    width:100%; text-align:left; padding:13px 16px; margin-bottom:8px;
    display:flex; align-items:center; gap:14px; font-size:15px; line-height:1.55;
    background:var(--card);
  }
  .opt .num{
    font-family:var(--mono); font-size:12px; width:22px; height:22px; flex:none;
    display:inline-flex; align-items:center; justify-content:center; border:1px solid currentColor;
  }
  .opt.sel{background:var(--turf); color:var(--card);}

  .chip{
    border:1px solid var(--rule); background:var(--card); color:var(--ink);
    padding:9px 13px; font-size:14px; border-radius:2px; transition:all .12s ease;
  }
  .chip:hover{border-color:var(--turf);}
  .chip.on{background:var(--turf); color:var(--card); border-color:var(--turf);}
  .chiprow{display:flex; flex-wrap:wrap; gap:7px;}

  input[type=text]{
    width:100%; padding:12px 14px; font-size:16px; font-family:var(--sans);
    background:var(--card); border:1px solid var(--rule); border-radius:2px; color:var(--ink);
  }
  input[type=text]:focus{outline:none; border-color:var(--turf);}

  .ticks{display:flex; gap:2px; height:6px; margin-bottom:30px;}
  .tick{flex:1; border:1px solid var(--rule);}
  .tick.done{background:var(--turf); border-color:transparent;}
  .tick.now{background:var(--brass); border-color:transparent;}

  .row{display:flex; align-items:center; gap:12px; border-top:1px solid var(--rule); padding:11px 0;}
  .row:last-of-type{border-bottom:1px solid var(--rule);}

  .linkish{background:none; border:none; color:var(--ink-soft); font-size:13px; padding:6px 0;}
  .fadein{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .overlay{
    position:fixed; inset:0; background:rgba(23,54,43,.82); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto;
  }
  .overlay img{max-width:100%; max-height:64vh; border:1px solid var(--rule); display:block; margin:0 auto 14px;}

  @media (prefers-reduced-motion: reduce){
    .btn,.chip{transition:none;} .fadein{animation:none;}

function score(upTo){
  var limit = (upTo === undefined) ? Q.length : upTo;
  var raw={E:0,A:0,C:0,S:0,O:0}, cnt={E:0,A:0,C:0,S:0,O:0};
  for(var i=0;i<limit;i++){
    var q=Q[i], a=S.answers[i];
    if(a===undefined || a===null) continue;
    cnt[q.f]++;
    raw[q.f] += q.sit ? q.o[a].v : (q.r ? 6-a : a);
  }
  var out={};
  ['E','A','C','S','O'].forEach(function(k){
    out[k] = cnt[k] ? Math.round((raw[k]-cnt[k])/(4*cnt[k])*100) : 50;
  });
  return out;
}

function resultOf(sc){
  var code = (sc.C>=50?'H':'L') + (sc.S>=50?'H':'L') + (sc.E>=50?'H':'L');
  return {
    code: code,
    type: TYPES[code],
    badgeA: sc.A>=50 ? BADGE_A.high : BADGE_A.low,
    badgeO: sc.O>=50 ? BADGE_O.high : BADGE_O.low
  };
}

function tipFor(code){
  var band = BAND[S.profile.avg];
  if(band && TIPS[code] && TIPS[code][band]) return TIPS[code][band];
  return TYPES[code].tip;
}

function introLine(code){
  var bits=[];
  if(S.profile.years) bits.push('구력 '+plabel('years', S.profile.years));
  if(S.profile.avg && S.profile.avg!=='sx') bits.push('평균 '+plabel('avg', S.profile.avg));
  var who = bits.length ? bits.join(', ')+'의 ' : '';
  return who + TYPES[code].name + '입니다.';
}

function interludeMsg(sc){
  if(sc.C>=65) return '준비는 확실히 되어 있는 편이네요. 후반은 그 준비가 스코어로 나오는 구간입니다.';
  if(sc.S<=35) return '전반에 한 번 크게 흔들린 티가 납니다. 후반 첫 홀은 안전하게 시작해보세요.';
  if(sc.E>=65) return '조 분위기는 당신이 만들고 있네요. 후반에도 그 페이스면 됩니다.';
  if(sc.A>=65) return '동반자 쪽을 계속 신경 쓰고 계시네요. 후반 9홀은 본인 볼만 보셔도 좋습니다.';

var SVG_SANS = "'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
var SVG_MONO = "ui-monospace,Menlo,Consolas,monospace";
var A0 = -Math.PI/2;
function axisPt(i, rr, cx, cy){
  var a = A0 + i*2*Math.PI/5;
  return [cx + rr*Math.cos(a), cy + rr*Math.sin(a)];
}
function radarSVG(sc){
  var W=340, H=310, cx=170, cy=152, R=92;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" role="img" aria-label="다섯 축 프로파일">';
  [0.25,0.5,0.75,1].forEach(function(f){
    var pts=[]; for(var i=0;i<5;i++){ var p=axisPt(i,R*f,cx,cy); pts.push(p[0].toFixed(1)+','+p[1].toFixed(1)); }
    s+='<polygon points="'+pts.join(' ')+'" fill="none" stroke="'+P.rule+'" stroke-width="1"/>';
  });
  for(var i=0;i<5;i++){
    var p=axisPt(i,R,cx,cy);
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'" stroke="'+P.rule+'" stroke-width="1"/>';
  }
  var dp=[];
  for(var j=0;j<5;j++){
    var v=Math.max(0,Math.min(100,sc[FACTORS[j].k]));
    var q=axisPt(j, R*(v/100), cx, cy);
    dp.push(q[0].toFixed(1)+','+q[1].toFixed(1));
  }
  s+='<polygon points="'+dp.join(' ')+'" fill="'+P.turfSoft+'" fill-opacity="0.3" stroke="'+P.turf+'" stroke-width="2" stroke-linejoin="round"/>';
  for(var m=0;m<5;m++){
    var d=dp[m].split(',');
    s+='<circle cx="'+d[0]+'" cy="'+d[1]+'" r="3" fill="'+P.turf+'"/>';
  }
  for(var n=0;n<5;n++){
    var lp=axisPt(n, R+26, cx, cy);
    var ax=lp[0], anchor='middle';
    if(ax>cx+12) anchor='start'; else if(ax<cx-12) anchor='end';
    s+='<text x="'+ax.toFixed(1)+'" y="'+(lp[1]+4).toFixed(1)+'" text-anchor="'+anchor+
       '" font-size="13" fill="'+P.turf+'" style="font-family:'+SVG_SANS+'">'+FACTORS[n].label+'</text>';
    s+='<text x="'+ax.toFixed(1)+'" y="'+(lp[1]+19).toFixed(1)+'" text-anchor="'+anchor+
       '" font-size="10.5" fill="'+P.inkSoft+'" style="font-family:'+SVG_MONO+'">'+sc[FACTORS[n].k]+'</text>';
  }
  return s+'</svg>';
}

function render(){

  if(S.stage==='cover') v=viewCover();
  else if(S.stage==='profile') v=viewProfile();
  else if(S.stage==='quiz') v=viewQuiz();
  else if(S.stage==='interlude') v=viewInterlude();

================================================================== */
function go(stage){ S.stage=stage; window.scrollTo(0,0); render(); }

function saveNick(){
  var el=document.getElementById('nick');
  if(el) S.profile.nick = el.value;
}

function answer(v){
  S.answers[S.idx] = v;
  var last = S.idx;
  track('hole-'+String(last+1).padStart(2,'0'), (last+1)+'홀 응답');
  setTimeout(function(){
    if(last === INTERLUDE_AT-1){ go('interlude'); return; }
    if(last < Q.length-1){ S.idx=last+1; window.scrollTo(0,0); render(); return; }
    startAnalyzing();
  }, 150);
  render();
}

function startAnalyzing(){
  S.analyzeStep = 0;
  go('analyzing');
  var total = analyzeLines().length;
  var timer = setInterval(function(){
    S.analyzeStep++;
    if(S.analyzeStep >= total){
      clearInterval(timer);
      var r = resultOf(score());
      track('complete', '18홀 완주');
      track('type/'+r.code, r.type.name);
      setTimeout(function(){ go('result'); }, 550);
    }
    render();
  }, 680);
}

function restart(){
  S.answers={}; S.idx=0; S.analyzeStep=0; S.cardURL=null;
  go('cover');
}

function shareText(){
  var sc=score(), r=resultOf(sc), nick=S.profile.nick.trim();
  return (nick? nick+'님의 ':'')+'라운드 스타일 — '+r.type.name+'\n'+
    '"'+r.type.tag+'"\n'+
    '준비성 '+sc.C+' · 멘탈 '+sc.S+' · 사교성 '+sc.E+' · 배려심 '+sc.A+' · 코스 이해 '+sc.O+'\n'+
    r.badgeA.name+' / '+r.badgeO.name+'\n'+SITE;
}

app.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act');

  if(act==='toProfile'){ track('start', '시작하기'); go('profile'); }
  else if(act==='toCover') { saveNick(); go('cover'); }
  else if(act==='pick'){
    saveNick();
    var k=b.getAttribute('data-k'), v=b.getAttribute('data-v');
    S.profile[k] = (S.profile[k]===v) ? '' : v;
    render();
  }
  else if(act==='toQuiz'){ saveNick(); track('teeoff', '첫 홀 티오프'); S.idx=0; go('quiz'); }
  else if(act==='ans') answer(parseInt(b.getAttribute('data-v'),10));
  else if(act==='back'){ if(S.idx>0){ S.idx--; window.scrollTo(0,0); render(); } }
  else if(act==='resume'){ S.idx=INTERLUDE_AT; go('quiz'); }
  else if(act==='restart') restart();
  else if(act==='copy'){
    var txt=shareText();
    track('text-copied', '텍스트 복사');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        b.textContent='복사했습니다';
        setTimeout(function(){ b.textContent='텍스트 복사'; },2000);
      });
    }
  }
  else if(act==='card'){ track('card-saved', '결과 카드 생성'); openCard(); }
});

document.addEventListener('keydown', function(e){
  if(S.stage!=='quiz') return;
  var q=Q[S.idx];
  var max = q.sit ? q.o.length : 5;
  var n = parseInt(e.key,10);
  if(n>=1 && n<=max) answer(q.sit ? n-1 : n);
  else if(e.key==='ArrowLeft' && S.idx>0){ S.idx--; render(); }
});

/* ==================================================================
   결과 카드 (1080 × 1350)
================================================================== */
var F = {
  serif: function(px, style){ return (style||'')+' '+px+'px Georgia, "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif'; },
  sans:  function(px, style){ return (style||'')+' '+px+'px "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif'; },
  mono:  function(px, style){ return (style||'')+' '+px+'px "SFMono-Regular", Menlo, Consolas, monospace'; }
};

function spacedText(ctx, text, cx, y, sp){
  var chars = String(text).split('');
  var w = 0, i;
  for(i=0;i<chars.length;i++) w += ctx.measureText(chars[i]).width + sp;
  w -= sp;
  var x = cx - w/2;
  for(i=0;i<chars.length;i++){
    ctx.fillText(chars[i], x, y);
    x += ctx.measureText(chars[i]).width + sp;
  }
}

function fitText(ctx, text, maxW, sizes, fontFn, style){
  for(var i=0;i<sizes.length;i++){
    ctx.font = fontFn(sizes[i], style);
    if(ctx.measureText(text).width <= maxW) return sizes[i];
  }
  return sizes[sizes.length-1];
}

function buildCard(){
  var W=1080, H=1350;
  var c=document.createElement('canvas');
  c.width=W; c.height=H;
  var ctx=c.getContext('2d');
  var sc=score(), r=resultOf(sc), t=r.type;
  var nick=S.profile.nick.trim();

  ctx.fillStyle=P.paper; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=P.card; ctx.fillRect(40,40,W-80,H-80);
  ctx.strokeStyle=P.rule; ctx.lineWidth=2; ctx.strokeRect(40,40,W-80,H-80);
  ctx.textBaseline='alphabetic';

  // 상단
  ctx.fillStyle=P.inkSoft; ctx.font=F.mono(19); ctx.textAlign='left';
  spacedText(ctx,'회계사의 클럽하우스 · 라운드 스타일 심리테스트', W/2, 128, 3);
  ctx.fillStyle=P.brass; ctx.fillRect(W/2-30, 152, 60, 2);

  ctx.textAlign='center'; ctx.fillStyle=P.inkSoft; ctx.font=F.sans(28);
  ctx.fillText(nick ? nick+'님의 라운드 스타일' : '나의 라운드 스타일', W/2, 214);

  // 스탬프
  ctx.strokeStyle=P.turf; ctx.lineWidth=4; ctx.strokeRect(150, 248, W-300, 196);
  ctx.fillStyle=P.brass; ctx.font=F.mono(19); ctx.textAlign='left';
  spacedText(ctx, t.en.toUpperCase(), W/2, 312, 5);
  ctx.textAlign='center'; ctx.fillStyle=P.turf;
  var ns=fitText(ctx, t.name, W-360, [64,56,50,44], F.serif);
  ctx.font=F.serif(ns);
  ctx.fillText(t.name, W/2, 400);

  // 태그라인
  ctx.fillStyle=P.red;
  var ts=fitText(ctx, t.tag, W-260, [34,30,27], F.serif, 'italic');
  ctx.font=F.serif(ts,'italic');
  ctx.fillText(t.tag, W/2, 500);

  // 레이더
  var cx=W/2, cy=745, R=152;
  ctx.lineWidth=1.5; ctx.strokeStyle=P.rule;
  [0.25,0.5,0.75,1].forEach(function(f){
    ctx.beginPath();
    for(var i=0;i<5;i++){ var p=axisPt(i,R*f,cx,cy); i? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]); }
    ctx.closePath(); ctx.stroke();
  });
  for(var i=0;i<5;i++){
    var p=axisPt(i,R,cx,cy);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p[0],p[1]); ctx.stroke();
  }
  ctx.beginPath();
  for(var j=0;j<5;j++){
    var v=Math.max(0,Math.min(100,sc[FACTORS[j].k]));
    var q=axisPt(j,R*(v/100),cx,cy);
    j? ctx.lineTo(q[0],q[1]) : ctx.moveTo(q[0],q[1]);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(46,85,70,.32)'; ctx.fill();
  ctx.strokeStyle=P.turf; ctx.lineWidth=4; ctx.stroke();
  ctx.font=F.sans(24); ctx.fillStyle=P.turf;
  for(var n=0;n<5;n++){
    var lp=axisPt(n,R+44,cx,cy);
    ctx.textAlign = lp[0]>cx+16 ? 'left' : (lp[0]<cx-16 ? 'right' : 'center');
    ctx.fillText(FACTORS[n].label, lp[0], lp[1]+8);
  }

  // 스코어 바
  ctx.textAlign='left';
  var y=960, L=150, RGT=930, barX=330, barW=RGT-60-barX;
  FACTORS.forEach(function(f){
    var v=sc[f.k], over=v>=50;
    ctx.strokeStyle=P.rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(L,y-26); ctx.lineTo(RGT,y-26); ctx.stroke();
    ctx.fillStyle=P.turf; ctx.font=F.serif(26); ctx.textAlign='left';
    ctx.fillText(f.label, L, y);
    ctx.fillStyle='rgba(23,54,43,.1)'; ctx.fillRect(barX, y-14, barW, 12);
    ctx.fillStyle = over?P.turf:P.red; ctx.fillRect(barX, y-14, barW*v/100, 12);
    ctx.fillStyle=P.brass; ctx.fillRect(barX+barW/2, y-19, 2, 22);
    ctx.fillStyle = over?P.turf:P.red; ctx.font=F.mono(26); ctx.textAlign='right';
    ctx.fillText(v, RGT, y);
    y += 48;
  });
  ctx.strokeStyle=P.rule; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(L,y-26); ctx.lineTo(RGT,y-26); ctx.stroke();

  // 배지
  ctx.textAlign='center'; ctx.fillStyle=P.turf; ctx.font=F.serif(24);
  ctx.fillText(r.badgeA.name+'   ·   '+r.badgeO.name, W/2, y+18);

  // 푸터
  ctx.fillStyle=P.inkSoft; ctx.font=F.mono(18); ctx.textAlign='left';
  spacedText(ctx, SITE.replace(/^https?:\/\//,'').replace(/\/$/,''), W/2, 1262, 2);
  ctx.textAlign='center'; ctx.font=F.sans(17);
  ctx.fillText('재미로 보는 콘텐츠이며 심리학적 진단이 아닙니다', W/2, 1292);

  return c;
}

function openCard(){
  var c = buildCard();
  var nick = S.profile.nick.trim() || '나';
  var url = c.toDataURL('image/png');

  var ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML =
    '<div style="max-width:460px;width:100%">'+
      '<img src="'+url+'" alt="결과 카드">'+
      '<p style="color:#E7E2D3;font-size:12.5px;line-height:1.7;text-align:center;margin:0 0 14px">'+
        '모바일에서는 이미지를 <b>길게 눌러</b> 저장하세요.'+
      '</p>'+
      '<div style="display:flex;gap:10px">'+
        '<a id="dl" href="'+url+'" download="라운드스타일_'+nick+'.png" '+
          'style="flex:1;text-align:center;padding:13px;background:#F5F2E9;color:#17362B;text-decoration:none;font-size:15px;border-radius:2px">이미지 저장</a>'+
        '<button id="close" style="flex:1;padding:13px;background:transparent;color:#F5F2E9;border:1px solid #F5F2E9;font-size:15px;border-radius:2px">닫기</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
  document.body.style.overflow='hidden';
  function close(){ ov.remove(); document.body.style.overflow=''; }
  ov.querySelector('#close').addEventListener('click', close);
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
}

render();
</script>
